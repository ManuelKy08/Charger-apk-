<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>SuperCharger</title>
<style>
  html,body{margin:0;padding:14px;background:#0b0f19;font-family:'Fira Mono','Roboto Mono','Droid Sans Mono',monospace;color:#d9e2ff;height:100%;box-sizing:border-box}
  *{box-sizing:border-box}
  .box{border:1px solid #1d2a4a;border-radius:12px;background:rgba(13,20,40,.6);box-shadow:0 0 24px rgba(0,229,255,.06);padding:14px 16px;margin-bottom:14px}
  .title{text-align:center;color:#00e5ff;font-weight:bold;letter-spacing:3px;font-size:17px;text-shadow:0 0 12px rgba(0,229,255,.55)}
  .title b{color:#7bf;font-weight:400;font-size:11px;letter-spacing:1px}

  .bat{display:flex;align-items:center;justify-content:center}
  .bat-main{flex:1;max-width:420px}
  .bat-top,.bat-bot{height:10px;background:#0d1428;border:2px solid #33508a;margin:0 18px}
  .bat-top{border-bottom:none;border-radius:6px 6px 0 0}
  .bat-bot{border-top:none;border-radius:0 0 6px 6px}
  .bat-nub{width:9px;height:28px;background:#33508a;border-radius:0 6px 6px 0;margin-left:-18px}
  .bat-fill{height:34px;background:#101a36;border:2px solid #33508a;border-top:none;border-bottom:none;margin:0 18px;position:relative}

  #levelbar{position:absolute;inset:0;left:0;background:linear-gradient(90deg,#ff5c5c,#ffd84d 45%,#3dff8a);box-shadow:0 0 18px rgba(61,255,138,.35);transition:width 1.2s cubic-bezier(.4,0,.2,1),box-shadow 1.2s,filter 1.2s}
  #levelbar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 3px,transparent 3px 8px)}

  #pct{text-align:center;font-size:44px;font-weight:bold;line-height:1.15;margin-top:14px;text-shadow:0 0 22px rgba(0,229,255,.25)}
  #cap{text-align:center;font-size:12px;color:#8ea2c7;margin-top:2px;letter-spacing:1px}

  .banner{border:1px solid #1d2a4a;border-radius:10px;padding:12px;text-align:center;font-weight:bold;letter-spacing:2px;font-size:16px}
  .ok{color:#3dff8a;border-color:#12633a;background:rgba(61,255,138,.06);text-shadow:0 0 14px rgba(61,255,138,.5)}
  .bad{color:#ff5c5c;border-color:#6e1b1b;background:rgba(255,92,92,.07);text-shadow:0 0 14px rgba(255,92,92,.5)}
  .warn{color:#ffd84d;border-color:#6e5a1b;background:rgba(255,216,77,.06);text-shadow:0 0 14px rgba(255,216,77,.5)}

  table{width:100%;border-collapse:collapse;font-size:13px}
  td{padding:6px 2px;border-bottom:1px dotted #1d2a4a}
  td:first-child{color:#8ea2c7;white-space:nowrap;padding-right:14px}
  td:last-child{font-weight:bold;text-align:right;letter-spacing:1px}
  .red{color:#ff5c5c}.grn{color:#3dff8a}.yel{color:#ffd84d}.cyn{color:#00e5ff}.mag{color:#ff8ecb}
  .foot{text-align:center;color:#56658a;font-size:11px;letter-spacing:1px}
  .dim{color:#56658a;font-size:11px;text-align:center;letter-spacing:1px}
  .glow-off{filter:saturate(.6) brightness(.85)}
</style>
</head>
<body>

  <div class="box">
    <div class="title">S U P E R   C H A R G E  ⚡<br><b>· data baterai real ·</b></div>
  </div>

  <div class="box">
    <div class="bat">
      <div style="flex:1">
        <div class="bat-top" style="margin-left:18px"></div>
        <div class="bat-fill"><div id="levelbar" style="width:0%"></div></div>
        <div class="bat-bot" style="margin-left:18px"></div>
      </div>
      <div class="bat-nub"></div>
    </div>
    <div id="pct">--%</div>
    <div id="cap">kapasitas -- mAh</div>
  </div>

  <div class="box"><div id="banner" class="banner warn">MENGAMBIL DATA...</div></div>

  <div class="box">
    <table>
      <tr><td>STATUS</td><td id="s-status"  class="yel">--</td></tr>
      <tr><td>KABEL</td><td id="s-cable"  class="grn">--</td></tr>
      <tr><td>LEVEL</td><td id="s-level"  class="cyn">--%</td></tr>
      <tr><td>ESTIMASI</td><td id="s-time"  class="mag">--</td></tr>
      <tr><td>SUMBER</td><td id="s-src"    class="grn">Battery API</td></tr>
    </table>
  </div>

  <div class="dim">· auto-refresh · layar gak mati selama dipakai ·<br>⚡ powered by Risky Manuel T</div>

<script>
"use strict";
(function () {
  var last = 0;

  function fmtTime(s) {
    if (s === Infinity || s < 0 || isNaN(s)) return "—";
    s = Math.round(s);
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), mm = Math.floor(s % 60);
    if (h > 0) return h + "j " + m + "m";
    if (m > 0) return m + "m " + mm + "s";
    return mm + "s";
  }

  function paint(b) {
    var level    = Math.round(b.level * 100);
    var charging = b.charging;
    var banner   = document.getElementById("banner");
    var bar      = document.getElementById("levelbar");
    var barBox   = document.getElementById("s-level");
    var pctEl    = document.getElementById("pct");

    document.getElementById("cap").textContent =
      "kapasitas " + Math.round(b.level * 4000) + " mAh";

    pctEl.textContent = level + "%";
    pctEl.style.color = level >= 90 ? "#3dff8a" : level >= 65 ? "#00e5ff"
                      : level >= 40 ? "#ffd84d" : "#ff5c5c";

    bar.style.width = level + "%";
    var hue = level >= 90 ? "rgba(61,255,138,.4)" : level >= 40 ? "rgba(255,216,77,.35)" : "rgba(255,92,92,.35)";
    bar.style.boxShadow = charging ? ("0 0 18px " + hue) : "none";

    if (charging) {
      banner.textContent = "⚡  SEDANG NGE-CHARGE";
      banner.className = "banner ok";
    } else if (level >= 100) {
      banner.textContent = "✓  BATERAI PENUH";
      banner.className = "banner ok";
    } else {
      banner.textContent = "⚠  GABUS NGE-CHARGE — COLOL DULU!";
      banner.className = "banner bad";
    }

    document.getElementById("s-status").textContent = charging ? "CHARGING" : "DISCHARGING";
    document.getElementById("s-status").className = charging ? "grn" : "red";
    document.getElementById("s-cable" ).textContent = charging ? "dicolok"           : "belum dicolok";
    document.getElementById("s-cable" ).className   = charging ? "grn"               : "red";
    document.getElementById("s-level" ).textContent = level + "%";
    document.getElementById("s-time"  ).textContent = charging ? "penuh ~ " + fmtTime(b.chargingTime)
                                                              : "sisa ~ "  + fmtTime(b.dischargingTime);

    last = level;
  }

  function fallback() {
    document.getElementById("s-src").textContent = "simulasi";
    document.getElementById("banner").textContent = "⚠  BROWSER GAK SUPPORT BATTERY API";
    document.getElementById("banner").className = "banner bad";
    paint({ level: 0.5, charging: true, chargingTime: 5400, dischargingTime: Infinity });
  }

  if (navigator.getBattery && navigator.getBattery) {
    navigator.getBattery().then(function (b) {
      paint(b);
      b.addEventListener("levelchange",     function () { paint(b); });
      b.addEventListener("chargingchange",  function () { paint(b); });
      b.addEventListener("chargingtimechange", function () { paint(b); });
    }, fallback);
    setTimeout(function () { if (!last) fallback(); }, 4000);
  } else {
    fallback();
  }
})();
</script>
</body>
</html>
